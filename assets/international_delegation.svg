<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="intlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#intlBg)"/>
  <circle cx="400" cy="250" r="220" fill="none" stroke="#3a506b" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="400" cy="250" r="160" fill="none" stroke="#48cae4" stroke-width="1" stroke-opacity="0.3"/>
  
  <!-- Center Emblem -->
  <circle cx="400" cy="250" r="55" fill="#1c2541" stroke="#48cae4" stroke-width="3"/>
  <text x="400" y="245" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">UiTM MALAYSIA</text>
  <text x="400" y="265" fill="#48cae4" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LOI SIGNATORY</text>

  <!-- International Nodes -->
  <!-- Malaysia -->
  <rect x="310" y="40" width="180" height="55" rx="8" fill="#0b132b" stroke="#48cae4" stroke-width="1.5"/>
  <text x="400" y="65" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🇲🇾 UiTM Shah Alam</text>
  <text x="400" y="82" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Lead Student Delegation</text>

  <!-- Indonesia UIB & UNI -->
  <rect x="550" y="180" width="200" height="65" rx="8" fill="#0b132b" stroke="#5bc0be" stroke-width="1.5"/>
  <text x="650" y="205" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🇮🇩 Batam & Nagoya (UNI)</text>
  <text x="650" y="225" fill="#5bc0be" font-family="sans-serif" font-size="10" text-anchor="middle">LOI Academic Exchange Partner</text>

  <!-- Indonesia USI -->
  <rect x="520" y="360" width="200" height="65" rx="8" fill="#0b132b" stroke="#6fffe9" stroke-width="1.5"/>
  <text x="620" y="385" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🇮🇩 Univ Semarang (USI)</text>
  <text x="620" y="405" fill="#6fffe9" font-family="sans-serif" font-size="10" text-anchor="middle">Benchmarking & Research</text>

  <!-- Singapore -->
  <rect x="80" y="360" width="200" height="65" rx="8" fill="#0b132b" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="180" y="385" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🇸🇬 Singapura Delegation</text>
  <text x="180" y="405" fill="#fda4af" font-family="sans-serif" font-size="10" text-anchor="middle">Jejak Diaspora Melayu 2024</text>

  <!-- Hong Kong -->
  <rect x="60" y="180" width="200" height="65" rx="8" fill="#0b132b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="160" y="205" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🇭🇰 Hong Kong Universities</text>
  <text x="160" y="225" fill="#fde68a" font-family="sans-serif" font-size="10" text-anchor="middle">Project Beyond Boundaries</text>

  <!-- Connection Lines -->
  <line x1="400" y1="95" x2="400" y2="195" stroke="#48cae4" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="455" y1="250" x2="550" y2="212" stroke="#5bc0be" stroke-width="2"/>
  <line x1="435" y1="290" x2="530" y2="360" stroke="#6fffe9" stroke-width="2"/>
  <line x1="360" y1="290" x2="260" y2="360" stroke="#f43f5e" stroke-width="2"/>
  <line x1="345" y1="250" x2="260" y2="212" stroke="#fbbf24" stroke-width="2"/>
</svg>