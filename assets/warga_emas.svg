  <text x="157" y="390" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">✓ 100% Hands-on Assisted</text>

  <!-- Module 2: Shopee -->
  <rect x="292" y="140" width="215" height="290" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
