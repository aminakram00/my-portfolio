  <text x="400" y="342" fill="#fb923c" font-family="sans-serif" font-size="11" text-anchor="middle">Scam Prevention & Buying</text>
  <text x="400" y="390" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">✓ Practical Purchasing Lab</text>

