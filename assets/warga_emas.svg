  <text x="70" y="95" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="600">SULAM INITIATIVE • JPKK KG. BUDIMAN • COMMUNITY DIGITAL INCLUSION</text>

  <!-- Module 1: TikTok -->
  <rect x="50" y="140" width="215" height="290" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
